name: Deploy Website

defaults:
  run:
    working-directory: website

on:
  push:
    branches:
      - 'main'
    paths:
      - 'website/**'
  # A deploy re-uploads index.html, which is what kicks the invalidation
  # Lambda; without this there is no way to refresh the CDN's cached
  # document short of committing a website change.
  workflow_dispatch:

permissions: {}

# Deploys must never be cancelled mid-flight — a half-finished `s3 sync
# --delete` is a broken site. Queue them instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_infrastructure:
    name: Check Terraform Status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.check_tf_status.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check last Terraform run status
        id: check_tf_status
        run: |
          # Bounded at 20 polls x 30s. The previous `while :;` had no cap and,
          # worse, no sleep on any status outside in_progress/queued — and when
          # `gh run list` returned no rows at all, jq errored on `null + string`
          # and left $status empty, so neither branch was taken and the loop
          # span at full speed against the API until the 6h job default.
          for _ in $(seq 1 20); do
            tf_status=$(gh run list --workflow="Terraform" --branch=main --limit=1 \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion // "")"' 2>/dev/null || true)

            status=${tf_status%% *}
            conclusion=${tf_status#* }

            echo "Current Terraform status: ${status:-<none>}, conclusion: ${conclusion:-<none>}"

            if [ "$status" = "completed" ]; then
              echo "Terraform run finished with conclusion: $conclusion"
              echo "status=$conclusion" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Terraform workflow has not finished yet. Waiting..."
            sleep 30
          done

          echo "::error::Timed out waiting for the Terraform workflow to finish."
          echo "status=timed_out" >> "$GITHUB_OUTPUT"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  setup:
    name: Setup Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - check_infrastructure
    permissions:
      contents: read

    if: ${{ needs.check_infrastructure.outputs.status == 'success' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.33.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  website_tests:
    name: Website Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - setup
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.33.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests on Website Components
        run: pnpm test

  build_prod:
    name: Build Production Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - setup
      - website_tests
    permissions:
      contents: read
    outputs:
      status: ${{ steps.mark_prod_build_success.outputs.success }}

    if: ${{ needs.website_tests.result == 'success' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.33.0'
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env file
        run: |
          touch .env
          echo VITE_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }} >> .env
          echo VITE_AWS_API_ENDPOINT=${{ secrets.AWS_API_ENDPOINT }} >> .env

      # Seed public/data/contributions.json with fresh data before building.
      # Between deploys the scheduled updateContributions Lambda keeps the same
      # object live in S3; the deploy syncs with --delete, so the build output
      # must contain the file. No token required. Non-fatal: on any hiccup the
      # committed last-known-good data is used so a deploy never breaks on this.
      - name: Refresh contribution heatmap data
        continue-on-error: true
        run: node scripts/fetch-contributions.mjs

      - name: Build Production Version
        run: pnpm build-prod

      - name: Save build cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            **/build
          key: ${{ runner.os }}-build-prod-${{ github.sha }}

      - name: Mark build as successful for deploy job
        id: mark_prod_build_success
        run: echo "success=true" >> $GITHUB_OUTPUT

  deploy:
    name: Upload to S3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - setup
      - build_prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Restore build cache
        if: ${{ needs.build_prod.outputs.status == 'true' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            **/build
          # No restore-keys. A prefix fallback would silently restore *some
          # earlier* build on an exact-key miss (save race, or the 7-day-idle
          # / 10 GB cache eviction), and the sync below publishes whatever it
          # finds with --delete. Better to fail loudly than deploy a build
          # that isn't this commit's.
          key: ${{ runner.os }}-build-prod-${{ github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_TF_DEPLOYMENT_REGION }}
          role-to-assume: ${{ secrets.AWS_S3_OIDC_ROLE }}
          role-session-name: GitHubWebsiteDeploy

      # The build has two kinds of object and they want opposite caching.
      #
      # `assets/` is content-hashed by Vite: a given URL's bytes never change,
      # so it can be cached forever. Everything else — above all `index.html`,
      # which is the map from those hashes to the live build — has a stable URL
      # and changing contents, so it has to be revalidated.
      #
      # Uploading with no Cache-Control at all (the previous behaviour) left
      # browsers to guess a freshness lifetime from Last-Modified. Safari guesses
      # generously, so it went on serving an `index.html` from before a deploy;
      # `--delete` had already removed the hashed bundles that copy pointed at,
      # those requests fell through to the SPA fallback and came back as HTML,
      # and a module script served as text/html is refused outright. The result
      # was a blank page — on whichever browser happened to be holding the stale
      # copy, and only until its cache aged out, which is why it looked like a
      # Safari bug. `no-cache` does not mean "don't store": the file still lives
      # in the browser cache, it just has to be revalidated first, which is a
      # bodyless 304 whenever nothing has changed.
      - name: Upload to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_PROD }}
        run: |
          set -euo pipefail
          BUCKET="s3://${{ env.AWS_S3_BUCKET }}/"

          # Bundles first, so nothing is ever referenced before it exists.
          aws s3 sync build/prod/ "$BUCKET" \
            --exclude '*' --include 'assets/*' \
            --cache-control 'public, max-age=31536000, immutable'

          # Then the documents that point at them, pruning anything the build
          # no longer produces.
          aws s3 sync build/prod/ "$BUCKET" --delete \
            --exclude 'assets/*' \
            --cache-control 'no-cache'

          # Superseded bundles are NOT deleted in the same run. A cached copy
          # of index.html keeps pointing at the bundles of its own build for
          # as long as any cache holds it — CloudFront held the document under
          # "/" for up to a day, and browser copies from before Cache-Control
          # was sent age out on heuristic lifetimes measured in days — so
          # bundles have to outlive documents by that margin, not by the
          # seconds a same-run delete gave them. Every sync above refreshes
          # LastModified on the objects the current build ships (fresh CI
          # mtimes force re-upload), so anything under assets/ still carrying
          # a 60-day-old timestamp has been out of every deployed index.html
          # for two months. Prune those; visitors on documents older than that
          # are caught by the boot recovery net in index.html.
          CUTOFF=$(date -u -d '60 days ago' +%s)
          aws s3api list-objects-v2 \
            --bucket "$AWS_S3_BUCKET" --prefix 'assets/' --output json |
            jq -r --argjson cutoff "$CUTOFF" '
              .Contents // [] | .[]
              | select((.LastModified
                  | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z")
                  | fromdate) < $cutoff)
              | .Key' |
            while IFS= read -r key; do
              # Belt to the timestamp braces: never drop a file the current
              # build actually shipped.
              [ -e "build/prod/$key" ] && continue
              aws s3 rm "${BUCKET}${key}"
            done

  cypress_e2e:
    name: Cypress E2E Tests
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
        with:
          working-directory: website
          install: false
          command: pnpm cypress:run
        env:
          CYPRESS_BASE_URL: https://${{ vars.AWS_TF_DOMAIN_NAME }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cypress-screenshots
          path: website/cypress/screenshots
          if-no-files-found: ignore
