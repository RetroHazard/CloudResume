# Manages the forwarding address printed on the generated CV.
#
# The CV never carries the real inbox. downloadResume prints a random alias
# (abracken.<generated>@<domain>) and forwardMail relays mail sent to it. Aliases
# rotate on their own: the first CV download of each calendar month issues a new
# one and retires the last, which keeps forwarding. This is the control panel:
#
#   status   list every alias with the month it was issued, its state, and what
#            has happened to its mail.
#   revoke   stop forwarding an alias outright: spam, abuse, a leak. With no
#            address given it revokes the live one, and the next CV download
#            issues a new one. Mail to a revoked alias is dropped silently.
#            forwardMail's abuse alert emails link straight here.
#   rotate   retire the live alias ahead of the monthly rotation. It keeps
#            forwarding; the next CV download issues a new one.
#
# Rotating or revoking the live alias deletes the table's "#current" pointer,
# which is all downloadResume needs to mint a replacement and re-render the CV.
name: CV contact address

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do.
        type: choice
        options: [status, revoke, rotate]
        default: status
      address:
        description: >-
          revoke only. A specific alias to revoke, e.g. an old retired one that has
          started attracting spam. Leave empty to revoke the live alias.
        type: string
        required: false
      reason:
        description: Optional note kept on the alias, e.g. "spam" or "leaked on a job board".
        type: string
        required: false

concurrency:
  group: cv-contact
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  manage:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TABLE: crc-mail-alias
      DOMAIN: ${{ vars.AWS_TF_DOMAIN_NAME }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_TF_DEPLOYMENT_REGION }}
          role-to-assume: ${{ secrets.AWS_TF_OIDC_ROLE }}
          role-session-name: GitHubCvContact

      - name: Rotate or revoke
        if: ${{ inputs.action != 'status' }}
        env:
          ACTION: ${{ inputs.action }}
          ADDRESS: ${{ inputs.address }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          current=$(aws dynamodb get-item --table-name "$TABLE" --consistent-read \
                      --key '{"id":{"S":"#current"}}' --query 'Item.address.S' --output text)
          [ "$current" = "None" ] && current=''

          # Accept a full address or just its local part.
          target=${ADDRESS%%@*}
          if [ -n "$target" ] && [ "$ACTION" != "revoke" ]; then
            echo "::error::An address can only be given with revoke; rotate always acts on the live alias."
            exit 1
          fi
          target=${target:-$current}
          if [ -z "$target" ]; then
            echo "No live alias. The next CV download will issue one."
            exit 0
          fi
          if ! [[ "$target" =~ ^[a-z0-9]+\.[a-z0-9]+$ ]]; then
            echo "::error::'$target' is not an alias local part."
            exit 1
          fi

          status=$([ "$ACTION" = "revoke" ] && echo revoked || echo retired)
          reason=${REASON:-manual $ACTION}
          values=$(jq -nc --arg s "$status" --arg t "$now" --arg r "$reason" \
                     '{":s":{"S":$s},":t":{"S":$t},":r":{"S":$r}}')
          aws dynamodb update-item --table-name "$TABLE" \
            --key "$(jq -nc --arg id "$target" '{id:{S:$id}}')" \
            --condition-expression 'attribute_exists(id)' \
            --update-expression 'SET #s = :s, #t = :t, #r = :r' \
            --expression-attribute-names "$(jq -nc --arg t "$status" '{"#s":"status","#t":$t,"#r":"reason"}')" \
            --expression-attribute-values "$values"

          # Only the live alias has a pointer. Removing it is what makes the next CV
          # download mint a replacement; the condition stops this from clobbering an
          # alias that some download minted in the meantime.
          if [ "$target" = "$current" ]; then
            aws dynamodb delete-item --table-name "$TABLE" \
              --key '{"id":{"S":"#current"}}' \
              --condition-expression '#a = :a' \
              --expression-attribute-names '{"#a":"address"}' \
              --expression-attribute-values "$(jq -nc --arg a "$target" '{":a":{S:$a}}')"
            note="The next CV download will issue a new address and re-render the CV."
          else
            note="The live alias is unchanged."
          fi
          echo "${target}@${DOMAIN} is now ${status}. ${note}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Status
        run: |
          set -euo pipefail
          aws dynamodb scan --table-name "$TABLE" --output json > aliases.json
          {
            echo '| Alias | Issued for | Status | Forwarded | Dropped | Last received |'
            echo '| --- | --- | --- | --- | --- | --- |'
            jq -r --arg domain "$DOMAIN" '
              .Items
              | map(select(.id.S != "#current"))
              | sort_by(.created.S) | reverse | .[]
              | "| \(.id.S)@\($domain) | \(.month.S // "—") | \(.status.S)\(if .reason.S then " (\(.reason.S))" else "" end) "
                + "| \(.forwarded.N // "0") | \(.dropped.N // "0") "
                + "| \((.last_received.S // "—")[0:16]) |"' aliases.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
