name: Terraform

defaults:
  run:
    working-directory: infrastructure

on:
  push:
    branches:
      - 'main'
    paths:
      - 'infrastructure/**'

permissions: {}

# An apply must never be cancelled part-way through, and two applies must never
# overlap on the same remote state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.PAT }}
  TF_VAR_github_token: ${{ secrets.PAT }}
  TF_VAR_deployment_region: ${{ vars.AWS_TF_DEPLOYMENT_REGION }}
  TF_VAR_domain_name: ${{ vars.AWS_TF_DOMAIN_NAME }}
  TF_VAR_sanitized_domain_name: ${{ vars.AWS_TF_SANITIZED_DOMAIN_NAME }}
  TF_VAR_api_current_stage: ${{ vars.AWS_TF_API_CURRENT_STAGE }}

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_TF_DEPLOYMENT_REGION }}
          role-to-assume: ${{ secrets.AWS_TF_OIDC_ROLE }}
          role-session-name: GitHubTerraformValidation

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: latest

      - name: Initialize
        run: terraform init

      - name: Validate Configuration
        run: terraform validate

  planning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validation
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_TF_DEPLOYMENT_REGION }}
          role-to-assume: ${{ secrets.AWS_TF_OIDC_ROLE }}
          role-session-name: GitHubTerraformPlan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: latest
          terraform_wrapper: true

      - name: Terraform Init
        id: initialize
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: planning
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_TF_DEPLOYMENT_REGION }}
          role-to-assume: ${{ secrets.AWS_TF_OIDC_ROLE }}
          role-session-name: GitHubTerraformApply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: latest
          terraform_wrapper: true

      - name: Terraform Init
        id: initialize
        run: terraform init

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
