version: 2

# Every action in this repo is pinned to a commit SHA, which is the right call
# but means nothing ever updates on its own — including security fixes. These
# keep the pins moving.
#
# Note that Dependabot PRs run without access to repo secrets, so the Terraform
# job in ci.yml deliberately skips for actor dependabot[bot] rather than failing
# red on an OIDC assume it could never make.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR a week rather than one per action.
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        # Majors land on their own so they get read properly.
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ['*']
