name: Setup web toolchain
description: Install pnpm and Node, restore the pnpm store, and install website dependencies.

inputs:
  install:
    description: Whether to run `pnpm install --frozen-lockfile`.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # pnpm has to land before setup-node: `cache: 'pnpm'` shells out to
    # `pnpm store path`, which needs pnpm already on PATH.
    #
    # No `version:` here on purpose. The action reads `packageManager` from the
    # manifest, which makes website/package.json the single source of truth —
    # the version used to be hardcoded in four places in website.yml plus the
    # manifest, so a bump meant editing five. `package_json_file` is required
    # because the manifest is under website/, not at the repo root.
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: website/package.json

    - name: Install Node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version-file: website/.nvmrc
        cache: 'pnpm'
        cache-dependency-path: website/pnpm-lock.yaml

    # `defaults.run.working-directory` from the calling workflow does not reach
    # inside a composite action, so every run step below sets it explicitly.
    # `shell:` is mandatory in composites too.
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: website
      run: pnpm install --frozen-lockfile
